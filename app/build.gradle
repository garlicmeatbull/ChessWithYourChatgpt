plugins { id 'com.android.application' }
android {
    namespace 'com.chesscoach.app'
    compileSdk 35
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.chesscoach.app'
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        testInstrumentationRunner 'com.chesscoach.app.NativeSmoke'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}
tasks.register('verifyStockfish') {
    doLast {
        ['arm64-v8a', 'x86_64'].each { abi ->
            if (!file("src/main/jniLibs/${abi}/libstockfish.so").exists()) {
                throw new GradleException('Run scripts/build-stockfish.sh before building the app')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyStockfish' }
