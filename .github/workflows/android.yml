name: Native Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHESS_TOOLCHAIN_DIR: /tmp/chess-toolchains
      ANDROID_HOME: /tmp/chess-toolchains/android-sdk
      ANDROID_SDK_ROOT: /tmp/chess-toolchains/android-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Optional stable development signing identity
        env:
          CHESS_DEBUG_KEYSTORE_BASE64: ${{ secrets.CHESS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get("CHESS_DEBUG_KEYSTORE_BASE64", "")
          if value:
              path = Path.home() / ".android" / "debug.keystore"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(value, validate=True))
              path.chmod(0o600)
          PYTHON
      - name: Android toolchain
        run: python3 scripts/bootstrap-cloud.py
      - name: Dependencies and native engines
        run: |
          npm ci --prefix companion
          bash scripts/build-stockfish.sh
          bash scripts/build-host-stockfish.sh
      - name: Rules, PGN, engine and server checks
        run: bash scripts/test-core.sh app/build/stockfish/host/src/stockfish
      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease lintDebug
      - name: Corresponding source with NNUE
        run: |
          python3 scripts/package-source.py
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ChessCoach-0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChessCoach-Android-and-source
          if-no-files-found: error
          path: |
            artifacts/ChessCoach-0.2.0.apk
            artifacts/ChessCoach-0.2.0-source.zip
