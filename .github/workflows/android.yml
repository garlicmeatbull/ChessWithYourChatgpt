name: Native Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHESS_TOOLCHAIN_DIR: /tmp/chess-toolchains
      ANDROID_HOME: /tmp/chess-toolchains/android-sdk
      ANDROID_SDK_ROOT: /tmp/chess-toolchains/android-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Optional stable development signing identity
        env:
          CHESS_DEBUG_KEYSTORE_BASE64: ${{ secrets.CHESS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get("CHESS_DEBUG_KEYSTORE_BASE64", "")
          if value:
              path = Path.home() / ".android" / "debug.keystore"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(value, validate=True))
              path.chmod(0o600)
          PYTHON
      - name: Android toolchain
        run: python3 scripts/bootstrap-cloud.py
      - name: Dependencies and native engines
        run: |
          bash scripts/build-stockfish.sh
          bash scripts/build-host-stockfish.sh
      - name: Rules, PGN and engine checks
        run: bash scripts/test-core.sh app/build/stockfish/host/src/stockfish
      - name: Build and lint
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug 2>&1 | tee /tmp/chess-build.log; then
            { echo '### Android build failure'; echo '```text'; tail -100 /tmp/chess-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Corresponding source with NNUE
        run: |
          python3 scripts/package-source.py
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ChessCoach-0.6.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChessCoach-Android-and-source
          if-no-files-found: error
          path: |
            artifacts/ChessCoach-0.6.1.apk
            artifacts/ChessCoach-0.6.1-source.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ChessCoach-Android-and-source
          path: artifacts
      - name: Validate version and release files
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          version = re.search(r"versionName '([^']+)'", Path('app/build.gradle').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match the APK version'
          for filename in [f'ChessCoach-{version}.apk', f'ChessCoach-{version}-source.zip']:
              assert (Path('artifacts') / filename).is_file(), f'Missing release asset: {filename}'
          assert Path(f'docs/releases/{version}.md').is_file(), 'Missing release notes'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON
      - name: Publish APK and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum "ChessCoach-${RELEASE_VERSION}.apk" "ChessCoach-${RELEASE_VERSION}-source.zip" > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" \
            "artifacts/ChessCoach-${RELEASE_VERSION}.apk" \
            "artifacts/ChessCoach-${RELEASE_VERSION}-source.zip" \
            artifacts/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Chess Coach ${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_VERSION}.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
